        - generic [ref=e130]:
          - heading "Life on the trail" [level=2] [ref=e131]
          - heading "Accommodation" [level=3] [ref=e132]
          - paragraph [ref=e133]: Established routes use simple teahouses or community lodges; restricted and remote itineraries may need arranged camping. Expect shared dining, limited heating and variable charging.
          - heading "Food" [level=3] [ref=e134]
          - paragraph [ref=e135]: Dal bhat, soups, noodles, potatoes and porridge are common. At altitude, choose freshly cooked food and avoid over-ordering where supplies are carried in.
          - heading "Water" [level=3] [ref=e136]
          - paragraph [ref=e137]: Use boiled, filtered or properly treated water. Avoid a daily trail of disposable plastic bottles.
        - generic [ref=e138]:
