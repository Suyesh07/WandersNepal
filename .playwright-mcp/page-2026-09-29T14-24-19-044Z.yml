        - generic [ref=e156]:
          - heading "Weather & altitude" [level=2] [ref=e157]
          - paragraph [ref=e158]: The broad trekking window is March–May · October–November. Mountain weather can still bring snow, cloud, wind and transport disruption. The route reaches 3,880 m; gradual ascent and honest symptom reporting matter more than a target day.
          - list [ref=e159]:
            - listitem [ref=e160]: Do not continue upward with worsening headache, nausea, dizziness or unusual fatigue.
            - listitem [ref=e161]: Keep the day before a high pass flexible.
            - listitem [ref=e162]: Carry layers for sun, wind, cold and precipitation.
        - generic [ref=e163]:
          - heading "Packing list" [level=2] [ref=e164]
          - list [ref=e165]:
            - listitem [ref=e166]: Broken-in trekking footwear
            - listitem [ref=e167]: Warm insulating layer
            - listitem [ref=e168]: Waterproof shell and trousers
            - listitem [ref=e169]: Sun hat, warm hat and gloves
            - listitem [ref=e170]: Refillable bottle and treatment method
            - listitem [ref=e171]: Head torch and power bank
            - listitem [ref=e172]: Personal medication and first-aid essentials
            - listitem [ref=e173]: Offline insurance and emergency details
            - listitem [ref=e174]: Trekking poles where useful
            - listitem [ref=e175]: Compact repair and blister kit
          - link "Open the full Nepal packing guide →" [ref=e176] [cursor=pointer]:
            - /url: /travel-guide/nepal-packing-list
        - generic [ref=e177]:
          - heading "Safety & responsible trekking" [level=2] [ref=e178]
          - paragraph [ref=e179]: Use licensed, insured staff; keep porter loads fair; stay on established trails; carry out non-biodegradable waste; and respect monasteries, fields and water sources. Your evacuation plan should work without a mobile signal.
          - link "Responsible trekking principles →" [ref=e180] [cursor=pointer]:
            - /url: /responsible-travel
        - generic [ref=e181]:
          - heading "Alternative itineraries" [level=2] [ref=e182]
          - list [ref=e183]:
            - listitem [ref=e184]: Add an acclimatisation day rather than compressing the ascent.
            - listitem [ref=e185]: Choose a shorter viewpoint route if time or experience is limited.
            - listitem [ref=e186]: Use an overland approach when flight disruption risk is unacceptable.
            - listitem [ref=e187]: Turn around or exit early without treating it as failure.
          - paragraph [ref=e188]:
            - text: Explore the wider
            - link "Everest destination guide" [ref=e189] [cursor=pointer]:
              - /url: /destinations/everest-region
            - text: .
        - generic [ref=e190]:
          - heading "Frequently asked questions" [level=2] [ref=e191]
          - heading "How difficult is Everest View Trek?" [level=3] [ref=e192]
          - paragraph [ref=e193]: Moderate; the combination of Approx. 45–65 km, altitude up to 3,880 m and consecutive days matters more than any single label.
          - heading "What is the best season?" [level=3] [ref=e194]
          - paragraph [ref=e195]: March–May · October–November is the broad planning window. Check snow, rain and transport conditions close to departure.
          - heading "Do I need insurance?" [level=3] [ref=e196]
          - paragraph [ref=e197]: Yes. Confirm that your policy covers the route’s maximum altitude, planned activities and emergency evacuation procedure.
