          - heading "Trek overview" [level=2] [ref=e83]
          - paragraph [ref=e84]: A shorter Khumbu route centred on Namche, Khumjung and mountain viewpoints without continuing to base camp.
          - paragraph [ref=e85]: This guide presents a conservative planning baseline, not a fixed commercial package. Daily distance, trailhead access and safe pacing change with the exact itinerary, weather and acclimatisation response.
