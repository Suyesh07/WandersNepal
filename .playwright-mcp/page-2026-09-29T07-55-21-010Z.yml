        - generic [ref=e352]:
          - heading "Everest Base Camp Helicopter Tour" [level=2] [ref=e353]
          - figure:
            - img "Everest Base Camp helicopter tour"
          - paragraph [ref=e354]: Depart early in the morning, when skies are often clearer for mountain views. A comfortable 3–4-seat helicopter takes you over a panorama that may include Manaslu, Ganesh Himal, Langtang, Jugal Himal, Cho Oyu, Everest and Makalu.
          - paragraph [ref=e355]: After about an hour, the tour may stop in Lukla for refreshments before continuing toward Namche Bazaar and Everest View Hotel. Depending on weather, aircraft performance and permissions, the route may include a brief stop near Kala Patthar (5,545 m / 18,192 ft) and a flyover near Everest Base Camp (about 5,364 m / 17,598 ft), with views of the Khumbu Icefall and glacier.
          - paragraph [ref=e356]: The return may include a short stop near Tengboche Monastery, surrounded by forest and high peaks, followed by views over Namche Bazaar and Lukla before landing in Kathmandu. A vehicle transfer returns you to your hotel. Stops and flight paths can change with weather and operating conditions.
        - generic [ref=e357]:
          - heading "Everest Base Camp Trek FAQ" [level=2] [ref=e358]
          - heading "How high is Everest Base Camp?" [level=3] [ref=e359]
          - paragraph [ref=e360]: Everest Base Camp is about 5,364 m (17,598 ft) above sea level.
          - heading "What should I pack for the Everest Base Camp Trek?" [level=3] [ref=e361]
          - paragraph [ref=e362]: Pack a backpack, hiking boots, down jacket, rain or windproof jacket, camp shoes, socks, trekking trousers, thermal wear, shirts or T-shirts, gloves, hat, sunglasses, sleeping bag, water bottle and purifier, trekking poles, gaiters, microspikes, map, other personal essentials, a medical kit, and clinic and health-post information.
          - heading "How much money should I take on the Everest Base Camp Trek?" [level=3] [ref=e363]
          - paragraph [ref=e364]: A standard all-inclusive 12- to 14-day guided Everest Base Camp trek package typically costs between $1,200 and $1,800 USD, or NPR 160,000 to NPR 240,000. Trekkers should also budget an extra $300 to $500 USD in physical cash for personal expenses on the trail.
