      - article [ref=e57]:
        - generic [ref=e58]:
          - heading "Everest Base Camp Trek Itinerary" [level=2] [ref=e59]
          - generic [ref=e60]:
            - generic [ref=e61]:
              - 'heading "Day 1: Arrival in Kathmandu (1,400 m / 4,593 ft)" [level=3] [ref=e62]'
              - generic [ref=e63]: Easy
            - paragraph [ref=e64]: Your journey starts with landing at Tribhuvan International Airport in Kathmandu, followed by a transfer to your hotel. Use this day to rest, meet your guide and get ready for the trek ahead. Overnight at a 3-star hotel in Kathmandu.
          - generic [ref=e65]:
            - generic [ref=e66]:
              - 'heading "Day 2: Kathmandu to Phakding via Lukla (2,610 m / 8,563 ft)" [level=3] [ref=e67]'
              - generic [ref=e68]: Easy
            - paragraph [ref=e69]: The trek officially begins with a 35-minute flight from Kathmandu to Lukla (2,860 m / 9,383 ft), the gateway to the Khumbu region. Alternatively, drive 5–6 hours by shared tourist vehicle to Manthali/Ramechhap (474 m / 1,555 ft), followed by a 20-minute flight to Lukla. From there, walk 3–4 hours to Phakding, passing Sherpa villages and mountain scenery. Overnight at a guesthouse in Phakding.
          - generic [ref=e70]:
            - generic [ref=e71]:
              - 'heading "Day 3: Phakding to Namche Bazaar (3,440 m / 11,286 ft)" [level=3] [ref=e72]'
              - generic [ref=e73]: Hard
            - paragraph [ref=e74]: Today's 5–6 hour walk takes you into Sagarmatha National Park and across several suspension bridges over the Dudh Koshi River, ending in Namche Bazaar, the busy trading town that serves as the hub of the Khumbu. Overnight at a guesthouse in Namche Bazaar.
          - generic [ref=e75]:
            - generic [ref=e76]:
              - 'heading "Day 4: Acclimatization Day in Namche Bazaar (3,440 m / 11,286 ft)" [level=3] [ref=e77]'
              - generic [ref=e78]: Moderate
            - paragraph [ref=e79]: This is a rest day built around altitude adjustment, with an optional 4–5 hour hike up to Hotel Everest View (3,880 m / 12,730 ft) for your first real look at Everest. Overnight at a guesthouse in Namche Bazaar.
          - generic [ref=e80]:
            - generic [ref=e81]:
              - 'heading "Day 5: Namche Bazaar to Tengboche (3,860 m / 12,664 ft)" [level=3] [ref=e82]'
              - generic [ref=e83]: Moderate
            - paragraph [ref=e84]: A 5–6 hour walk through rhododendron forest brings you to Tengboche, known for its monastery and mountain views, including Ama Dablam and Everest. Overnight at a guesthouse in Tengboche.
          - generic [ref=e85]:
            - generic [ref=e86]:
              - 'heading "Day 6: Tengboche to Dingboche (4,410 m / 14,469 ft)" [level=3] [ref=e87]'
              - generic [ref=e88]: Moderate
            - paragraph [ref=e89]: The trail climbs into more open terrain on this 5–6 hour stretch to Dingboche, a small village surrounded by some of the highest peaks in the world. Overnight at a guesthouse in Dingboche.
          - generic [ref=e90]:
            - generic [ref=e91]:
              - 'heading "Day 7: Acclimatization Day in Dingboche (4,410 m / 14,469 ft)" [level=3] [ref=e92]'
              - generic [ref=e93]: Moderate
            - paragraph [ref=e94]: Take a rest day, with the option to hike to Nangkartsang Peak (5,083 m / 16,676 ft) for views of Makalu, Lhotse and the Imja Valley. The round trip takes about 4–5 hours. Overnight at a guesthouse in Dingboche.
          - generic [ref=e95]:
            - generic [ref=e96]:
              - 'heading "Day 8: Dingboche to Lobuche (4,910 m / 16,109 ft)" [level=3] [ref=e97]'
              - generic [ref=e98]: Hard
            - paragraph [ref=e99]: This 5–6 hour day crosses rugged high-altitude terrain. Pass memorials for climbers who died attempting Everest, a quiet reminder of the mountain's scale. Overnight at a guesthouse in Lobuche.
          - generic [ref=e100]:
            - generic [ref=e101]:
              - 'heading "Day 9: Lobuche to Everest Base Camp (5,364 m / 17,598 ft) via Gorak Shep" [level=3] [ref=e102]'
              - generic [ref=e103]: Hard
            - paragraph [ref=e104]: This is the day many trekkers have been waiting for. Trek from Lobuche to Gorak Shep, continue to Everest Base Camp, then return to Gorak Shep for the night. Allow 8–9 hours for the trek and return. Overnight at a guesthouse in Gorak Shep.
          - generic [ref=e105]:
            - generic [ref=e106]:
              - 'heading "Day 10: Kala Patthar (about 5,550 m / 18,209 ft) to Pheriche (4,240 m / 13,911 ft)" [level=3] [ref=e107]'
              - generic [ref=e108]: Hard
            - paragraph [ref=e109]: An early start takes you to Kala Patthar for sunrise, widely considered one of the best viewpoints of Everest's summit on the trek, before descending to Pheriche. Allow roughly 7–8 hours in total. Overnight at a guesthouse in Pheriche.
          - generic [ref=e110]:
            - generic [ref=e111]:
              - 'heading "Day 11: Pheriche to Namche Bazaar (3,440 m / 11,286 ft)" [level=3] [ref=e112]'
              - generic [ref=e113]: Hard
            - paragraph [ref=e114]: From here, the route is mostly downhill. Walk 7–8 hours back through familiar villages to Namche Bazaar. Overnight at a guesthouse in Namche Bazaar.
          - generic [ref=e115]:
            - generic [ref=e116]:
              - 'heading "Day 12: Namche Bazaar to Lukla (2,860 m / 9,383 ft)" [level=3] [ref=e117]'
              - generic [ref=e118]: Hard
            - paragraph [ref=e119]: The last full day of trekking covers 7–8 hours back to Lukla, where the walking part of the journey wraps up. Overnight at a guesthouse in Lukla.
          - generic [ref=e120]:
            - generic [ref=e121]:
              - 'heading "Day 13: Lukla to Kathmandu" [level=3] [ref=e122]'
              - generic [ref=e123]: Moderate
            - paragraph [ref=e124]: A 35-minute flight takes you from Lukla back to Kathmandu. Alternatively, take a 20-minute flight to Manthali/Ramechhap, followed by a 5–6 hour drive to Kathmandu by shared tourist vehicle. Overnight at a 3-star hotel in Kathmandu.
          - generic [ref=e125]:
            - generic [ref=e126]:
              - 'heading "Day 14: Final Departure" [level=3] [ref=e127]'
              - generic [ref=e128]: Easy
            - paragraph [ref=e129]: Transfer to Tribhuvan International Airport for your flight home, bringing the trip to a close.
